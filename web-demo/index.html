<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>World Radio — e-ink globe prototype</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="errbar" role="alert"></div>
  <script>
    // Failsafe: surface any load/runtime error visibly instead of a blank page,
    // and warn if the app never booted (e.g. a script 404'd).
    (function () {
      function show(msg) {
        var b = document.getElementById('errbar');
        if (!b) return;
        b.style.display = 'block';
        b.textContent = msg;
      }
      window.addEventListener('error', function (e) {
        show('Load/JS error: ' + (e.message || e.type) + (e.filename ? '  (' + e.filename.split('/').pop() + ')' : ''));
      });
      window.addEventListener('DOMContentLoaded', function () {
        setTimeout(function () {
          if (!window.__WR_BOOTED) {
            show('App did not start. Make sure you are viewing http://localhost:4173 (run: node server.mjs in world-radio/). Scripts may have failed to load.');
          }
        }, 1500);
      });
    })();
  </script>

  <header class="topbar">
    <div class="brand">WORLD RADIO <span class="sub">e-ink globe prototype</span></div>
    <div class="hint">This canvas is a pixel-faithful preview of a 1-bit B&amp;W e-ink panel. The render code in
      <code>src/projection.js</code> ports directly to ESP32-S3.</div>
  </header>

  <main class="stage">
    <section class="device">
      <div class="bezel">
        <canvas id="screen" aria-label="e-ink globe panel"></canvas>
      </div>
      <div class="controls">
        <button id="prev" title="Previous station (←)">◀ Prev</button>
        <button id="play" title="Play / stop (space)">▶ / ■</button>
        <button id="next" title="Next station (→)">Next ▶</button>
      </div>
      <div class="options">
        <label class="field">Panel
          <select id="panel"></select>
        </label>
        <label class="field">Render style
          <select id="style"></select>
        </label>
        <label class="chk"><input type="checkbox" id="graticule" checked /> Graticule</label>
        <label class="chk"><input type="checkbox" id="eink" /> Simulate e-ink refresh</label>
        <button id="fullrefresh" class="ghost" title="Clear ghosting (F)">Full refresh</button>
        <button id="live" class="ghost" title="Pull real geolocated stations">Load live stations</button>
      </div>
      <p id="status" class="status">Booting…</p>
    </section>

    <aside class="sidebar">
      <h2>Stations</h2>
      <div id="list" class="list"></div>
    </aside>
  </main>

  <audio id="audio" crossorigin="anonymous"></audio>

  <!-- Classic scripts, loaded in dependency order. No ES modules, no fetch, so
       this runs on any static server and even over file://. -->
  <script src="./public/coastline.js"></script>
  <script src="./public/land.js"></script>
  <script src="./src/projection.js"></script>
  <script src="./src/stations.js"></script>
  <script src="./src/app.js"></script>
</body>
</html>
